name: Automated Testing & Build Validation

on:
  pull_request:
    branches:
      - main
      - staging
      - develop
  push:
    branches:
      - staging
      - develop

permissions:
  contents: read

jobs:
  test:
    name: Run Unit & E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Validate Build
        run: npm run build
